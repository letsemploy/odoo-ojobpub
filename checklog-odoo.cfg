# Log records that oca_checklog_odoo (CI) does not treat as failures.
[checklog-odoo]
ignore=
    # attachment_indexation (installed with hr_recruitment) without the optional
    # pdfminer.six. Installing it in CI upgrades cryptography past what the
    # pinned pyOpenSSL of Odoo 18/19/20 supports, which breaks Odoo itself.
    WARNING .* odoo\.addons\.attachment_indexation\.models\.ir_attachment: Attachment indexation of PDF documents is unavailable.*
