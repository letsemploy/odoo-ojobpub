target-version = "py312"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
# timezone.utc instead of datetime.UTC keeps the code identical to the
# 18.0/19.0 branches, so fixes forward-port without conflicts.
ignore = ["UP017"]

[lint.isort]
known-first-party = ["odoo"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"__manifest__.py" = ["B018"]
